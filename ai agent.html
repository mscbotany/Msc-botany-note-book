<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | M.Sc. Botany Notes Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 60px;
            color: #4ade80;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-chat {
            background: #22c55e;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .btn-chat:hover {
            transform: translateY(-3px);
            background: #16a34a;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <i class="fas fa-seedling"></i>
        </div>
        <h1>Welcome to help box </h1>
        <p>यहाँ आपको M.Sc. Botany के सभी सेमेस्टर के प्रीमियम नोट्स और पिछले साल के पेपर मिलेंगे।</p>
        
        <p style="font-style: italic; font-size: 14px;">"मदद के लिए नीचे दिए गए चैट बटन का उपयोग करें!"</p>
        
        <div class="footer-note">
            Powered by Tidio AI Support
        </div>
    </div>

    <script src="//code.tidio.co/6ilyp3oo2inncrlzpqojqtvdplftiazz.js" async></script>

</body>
</html>
